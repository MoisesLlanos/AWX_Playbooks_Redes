---
# Reinicia el switch.
#
# ############################ AVISO ############################
# En Cisco SF/SG, todo lo que no este guardado en startup-config SE PIERDE al
# reiniciar. Y en este repo el "write memory" esta comentado en todos los
# playbooks, asi que cualquier cambio aplicado desde el ultimo guardado manual
# desaparece: VLANs, troncales, accesos, SNMP, hostname.
#
# Por defecto NO guarda, porque a veces se reinicia justamente para descartar
# cambios. Pasa guardar_antes: true si quieres conservar lo aplicado.
# ###############################################################
#
# serial: 1 a proposito, para no reiniciar varios switches a la vez.
- name: Reiniciar Cisco SF/SG/CBS
  hosts: EquiposCisco
  gather_facts: false
  serial: 1

  vars:
    guardar_antes: false
    espera_inicial: 60
    espera_maxima: 420
    # hostvars[...] en lugar de ansible_host porque dentro de
    # delegate_to: localhost, ansible_host apunta al host delegado.
    ip_equipo: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
    puerto_ssh: "{{ ansible_port | default(22) }}"

  pre_tasks:
    - name: Avisar de que se van a perder los cambios sin guardar
      ansible.builtin.debug:
        msg: >-
          guardar_antes=false: lo que no este en startup-config se perdera.
          Pasa guardar_antes: true si quieres conservarlo.
      when: not (guardar_antes | bool)

  tasks:
    - name: Leer el estado antes de reiniciar
      community.ciscosmb.command:
        commands:
          - show system
      register: estado_antes
      changed_when: false

    # El SF pregunta "Overwrite file [startup-config]...". Verifica el texto
    # exacto en tu firmware si esta tarea se queda colgada.
    - name: Guardar la configuracion antes de reiniciar
      ansible.netcommon.cli_command:
        command: write memory
        prompt:
          - '\[startup-config\]'
        answer:
          - 'Y'
      when: guardar_antes | bool
      changed_when: true

    # El "reload" del SF/SG hace dos preguntas y el texto cambia entre
    # firmwares. A la de guardar se responde N a proposito: guardar se decide
    # con la variable guardar_antes, no por un prompt.
    # Verifica los textos con "reload" a mano si esta tarea falla.
    - name: Lanzar el reinicio
      ansible.netcommon.cli_command:
        command: reload
        prompt:
          - '(?i)save them now'
          - '(?i)do you want to continue'
        answer:
          - 'N'
          - 'Y'
      ignore_errors: true
      ignore_unreachable: true
      changed_when: true

    - name: Cerrar la conexion anterior
      ansible.builtin.meta: reset_connection

    - name: Esperar a que el switch vuelva
      ansible.builtin.wait_for:
        host: "{{ ip_equipo }}"
        port: "{{ puerto_ssh | int }}"
        delay: "{{ espera_inicial | int }}"
        timeout: "{{ espera_maxima | int }}"
        state: started
      delegate_to: localhost

    - name: Leer el estado despues del reinicio
      community.ciscosmb.command:
        commands:
          - show system
      register: estado_despues
      until: estado_despues is succeeded
      retries: 8
      delay: 15
      changed_when: false

    # El "System Up Time" es la prueba de que reinicio de verdad, y no solo de
    # que el puerto 22 volvio a responder.
    - name: Mostrar el estado antes y despues
      ansible.builtin.debug:
        msg:
          antes: "{{ estado_antes.stdout_lines[0] | select('search', '(?i)up time') | list }}"
          despues: "{{ estado_despues.stdout_lines[0] | select('search', '(?i)up time') | list }}"


######  VARIABLES EN AWX  #######

# No necesita variables. Opcionales:
# guardar_antes: false   # true ejecuta "write memory" antes de reiniciar
# espera_inicial: 60     # segundos antes de empezar a comprobar el puerto SSH
# espera_maxima: 420     # segundos como maximo esperando a que vuelva
#
# Reinicia todo lo que coincida con el Limite de AWX.
