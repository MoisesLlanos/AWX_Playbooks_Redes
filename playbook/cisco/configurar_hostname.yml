---
- name: Cambiar hostname del Cisco SF300
  hosts: EquiposCisco
  gather_facts: false

  vars:
    guardar_configuracion: false
    ansible_command_timeout: 60
    ansible_connect_timeout: 30

  tasks:
    - name: Exigir la selección de un solo switch
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
        fail_msg: >-
          Debes seleccionar un solo switch mediante el campo
          Límite de AWX.

    - name: Validar variable nuevo_hostname
      ansible.builtin.assert:
        that:
          - nuevo_hostname is defined
          - nuevo_hostname | default('') | length >= 1
          - nuevo_hostname | default('') | length <= 63
          - nuevo_hostname | default('') is match('^[A-Za-z0-9][A-Za-z0-9-]*$')
        fail_msg: >-
          Debes proporcionar la variable nuevo_hostname.
          Solo se permiten letras, números y guiones.
          No puede comenzar con guion.

    - name: Comprobar conexión con el switch
      community.ciscosmb.command:
        commands:
          - show system
      register: estado_inicial
      changed_when: false

    - name: Mostrar información inicial
      ansible.builtin.debug:
        var: estado_inicial.stdout_lines

    - name: Entrar al modo de configuración
      ansible.netcommon.cli_command:
        command: configure terminal
      changed_when: false

    - name: Cambiar hostname sin esperar el nuevo prompt
      ansible.netcommon.cli_command:
        command: "hostname {{ nuevo_hostname }}"
        sendonly: true
      changed_when: true

    - name: Esperar que el switch procese el nuevo hostname
      ansible.builtin.pause:
        seconds: 3

    - name: Cerrar la conexión que conserva el prompt anterior
      ansible.builtin.meta: reset_connection

    - name: Verificar el nuevo hostname usando una conexión nueva
      community.ciscosmb.command:
        commands:
          - show system
      register: estado_final
      changed_when: false

    - name: Mostrar resultado de la verificación
      ansible.builtin.debug:
        var: estado_final.stdout_lines

